[project]
name = "youtube-mixtape-generator"
version = "0.1.0"
description = "Automated YouTube Mixtape Creation Pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydub>=0.25.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.36.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[project.scripts]
backend = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

